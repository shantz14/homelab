apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: personal-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: traefik
  rules:
  - host: isaacschwarz.dev
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: personal-service
            port:
              number: 80
