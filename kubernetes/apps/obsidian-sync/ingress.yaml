apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: couchdb
  namespace: obsidian-sync
spec:
  ingressClassName: traefik
  rules:
    - host: obsidian-sync.isaacschwarz.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: couchdb
                port:
                  number: 5984
