apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: prometheus-system
spec:
  interval: 30m
  releaseName: prometheus
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "93.1.2"
      sourceRef:
        kind: HelmRepository
        name: prometheus
  values:
    kubeEtcd:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false

    prometheus:
      prometheusSpec:
        retention: 15d
        retentionSize: 18GB
        nodeSelector:
          kubernetes.io/hostname: k3s-w1
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 20Gi
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
    alertmanager:
      alertmanagerSpec:
        nodeSelector:
          kubernetes.io/arch: amd64
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 1Gi
        secrets:
          - alertmanager-discord   # mounted at /etc/alertmanager/secrets/alertmanager-discord/
      config:
        route:
          receiver: discord
          group_by: [alertname, namespace]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          routes:
            - receiver: "null"
              matchers: ['alertname = "Watchdog"']      # later: healthchecks.io
            - receiver: "null"
              matchers: ['alertname = "InfoInhibitor"']
        receivers:
          - name: "null"
          - name: discord
            discord_configs:
              - webhook_url_file: /etc/alertmanager/secrets/alertmanager-discord/webhook-url
                send_resolved: true
        inhibit_rules:
          - source_matchers: ['severity = "critical"']
            target_matchers: ['severity =~ "warning|info"']
            equal: [namespace, alertname]
          - source_matchers: ['severity = "warning"']
            target_matchers: ['severity = "info"']
            equal: [namespace, alertname]
          - source_matchers: ['alertname = "InfoInhibitor"']
            target_matchers: ['severity = "info"']
            equal: [namespace]
          - target_matchers: ['alertname = "InfoInhibitor"']

    grafana:
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      ingress:
        enabled: true
        ingressClassName: traefik
        hosts:
          - grafana.lab.home
      persistence:
        enabled: false        # the default; written out so it's clear it's on purpose
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
            - name: default
              orgId: 1
              folder: ""
              type: file
              disableDeletion: true
              editable: true
              options:
                path: /var/lib/grafana/dashboards/default
      dashboards:
        default:
          node-exporter-full:
            gnetId: 1860
            revision: 46
            datasource: Prometheus
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  timeout: 15m
